<script>
        // Micro-interaction: Reveal cards sequentially
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.glass-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 1.2s cubic-bezier(0.22, 1, 0.36, 1)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 400 + (index * 300));
            });
            
            // Progress bar animation simulation
            setTimeout(() => {
                document.querySelector('.ritual-progress-bar').style.width = '100%';
            }, 500);
        });

        // Horizontal scroll momentum effect for cards on mobile
        const scrollContainer = document.querySelector('.overflow-x-auto');
        if (scrollContainer) {
            scrollContainer.addEventListener('scroll', () => {
                const center = scrollContainer.scrollLeft + scrollContainer.offsetWidth / 2;
                document.querySelectorAll('.glass-card').forEach((card) => {
                    const cardCenter = card.parentElement.offsetLeft + card.parentElement.offsetWidth / 2;
                    const dist = Math.abs(center - cardCenter);
                    const scale = Math.max(0.95, 1 - (dist / 1000));
                    const opacity = Math.max(0.6, 1 - (dist / 1200));
                    card.style.transform = `scale(${scale})`;
                    card.style.opacity = opacity;
                });
            });
        }
    </script>
