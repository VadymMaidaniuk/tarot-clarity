<script>
        function handleSelection(el) {
            // Remove active styles from all
            document.querySelectorAll('button.border-primary\\/40').forEach(btn => {
                btn.classList.remove('border-primary/40', 'bg-surface-container-high');
                btn.classList.add('border-primary/10', 'bg-surface-container-low');
            });
            
            // Add active styles to clicked
            el.classList.remove('border-primary/10', 'bg-surface-container-low');
            el.classList.add('border-primary/40', 'bg-surface-container-high');

            // Interactive scale effect
            el.classList.add('scale-[0.98]');
            setTimeout(() => {
                el.classList.remove('scale-[0.98]');
            }, 150);

            // Subtle progress bar bump
            const currentWidth = parseInt(document.getElementById('progress-bar').style.width);
            if (currentWidth < 80) {
                document.getElementById('progress-bar').style.width = (currentWidth + 5) + '%';
            }
        }

        // Parallax Effect for Background Glow
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.bg-secondary\\/5');
            const x = (e.clientX / window.innerWidth - 0.5) * 40;
            const y = (e.clientY / window.innerHeight - 0.5) * 40;
            glow.style.transform = `translate(calc(-50% + ${x}px), ${y}px)`;
        });
    </script>
