<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AURA | The Situation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #0A0E14;
            color: #dfe2eb;
            overflow-x: hidden;
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(26, 31, 38, 0.4) 0%, rgba(10, 14, 20, 0.4) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .ritual-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, #BDB5D5, transparent);
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .gold-glow {
            box-shadow: 0 0 40px rgba(189, 181, 213, 0.05);
        }

        textarea::placeholder {
            color: rgba(202, 194, 226, 0.3);
            font-style: italic;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        /* Subtle Fade In Animation */
        @keyframes fadeInContent {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-content {
            animation: fadeInContent 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Input specific focus effect */
        .aura-input {
            transition: all 0.5s ease;
            border-color: rgba(189, 181, 213, 0.1);
        }
        .aura-input:focus {
            border-color: rgba(189, 181, 213, 0.6);
            outline: none;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-container": "#aeb3bc",
                      "secondary-container": "#49435e",
                      "secondary-fixed": "#e7deff",
                      "secondary-fixed-dim": "#cac2e2",
                      "error-container": "#93000a",
                      "primary-fixed": "#ffe088",
                      "on-tertiary-container": "#40454d",
                      "inverse-on-surface": "#2d3137",
                      "surface-tint": "#e9c349",
                      "on-surface": "#dfe2eb",
                      "on-tertiary-fixed-variant": "#42474f",
                      "on-tertiary-fixed": "#171c23",
                      "tertiary": "#caced8",
                      "on-secondary-container": "#b9b1d1",
                      "on-secondary": "#322d46",
                      "on-background": "#dfe2eb",
                      "on-secondary-fixed-variant": "#49435e",
                      "surface-container-highest": "#31353c",
                      "surface-container": "#1c2026",
                      "error": "#ffb4ab",
                      "primary": "#f2ca50",
                      "surface-bright": "#353940",
                      "primary-container": "#d4af37",
                      "on-primary-container": "#554300",
                      "surface": "#10141a",
                      "outline": "#99907c",
                      "surface-container-lowest": "#0a0e14",
                      "primary-fixed-dim": "#e9c349",
                      "on-primary-fixed-variant": "#574500",
                      "inverse-surface": "#dfe2eb",
                      "on-tertiary": "#2c3138",
                      "on-primary-fixed": "#241a00",
                      "tertiary-fixed": "#dee2ec",
                      "surface-variant": "#31353c",
                      "surface-dim": "#10141a",
                      "on-error-container": "#ffdad6",
                      "outline-variant": "#4d4635",
                      "on-primary": "#3c2f00",
                      "inverse-primary": "#735c00",
                      "surface-container-high": "#262a31",
                      "surface-container-low": "#181c22",
                      "on-surface-variant": "#d0c5af",
                      "on-secondary-fixed": "#1d1830",
                      "secondary": "#cac2e2",
                      "background": "#10141a",
                      "on-error": "#690005",
                      "tertiary-fixed-dim": "#c2c7d0"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "container-padding-mobile": "24px",
                      "stack-sm": "12px",
                      "gutter": "16px",
                      "section-gap": "80px",
                      "unit": "8px",
                      "container-padding-desktop": "64px",
                      "stack-md": "24px"
              },
              "fontFamily": {
                      "headline-lg-mobile": ["Playfair Display"],
                      "label-md": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-md": ["Playfair Display"],
                      "headline-xl": ["Playfair Display"],
                      "body-lg": ["Inter"],
                      "headline-lg": ["Playfair Display"],
                      "caption": ["Inter"]
              },
              "fontSize": {
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "400"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                      "headline-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "400"}],
                      "caption": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- Ritual Progress Indicator -->
<div class="ritual-line">
<div class="h-full bg-primary" id="progress" style="width: 75%; transition: width 2s ease-in-out;"></div>
</div>
<!-- TopAppBar (Suppressed FAB for this transactional/input screen) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-padding-mobile h-16 bg-background/80 backdrop-blur-xl border-b border-primary/15">
<div class="flex items-center">
<button class="text-primary dark:text-primary-fixed hover:opacity-80 transition-opacity duration-300 active:scale-95 transition-transform duration-500">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile tracking-widest text-primary dark:text-primary-fixed">
            AURA
        </div>
<div class="flex items-center">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:opacity-80 transition-opacity duration-300">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-start pt-32 px-container-padding-mobile md:px-container-padding-desktop">
<div class="max-w-[700px] w-full animate-content">
<!-- Headline Section -->
<div class="mb-12 text-center">
<h1 class="font-headline-xl text-headline-xl mb-4 text-on-surface tracking-tight">The Situation.</h1>
<p class="font-body-lg text-body-lg text-secondary-fixed-dim/70 max-w-lg mx-auto">
                    What happened, and what still feels unresolved?
                </p>
</div>
<!-- Input Section -->
<div class="relative group mb-16">
<!-- Subtle glow background -->
<div class="absolute -inset-4 bg-primary/5 rounded-xl blur-2xl opacity-0 group-focus-within:opacity-100 transition-opacity duration-700"></div>
<div class="relative">
<label class="block uppercase font-label-md text-label-md text-secondary-fixed/40 mb-3 tracking-[0.2em]">The Narrative</label>
<textarea class="aura-input w-full min-h-[320px] bg-surface-container-lowest border-b border-l-0 border-r-0 border-t-0 border-secondary-fixed/20 p-8 font-body-lg text-body-lg leading-relaxed text-on-surface resize-none glass-panel" placeholder="Write freely..."></textarea>
<!-- Ritual Accents (Diamonds) -->
<div class="absolute bottom-4 right-4 flex space-x-2">
<div class="w-1.5 h-1.5 rotate-45 border border-primary/40"></div>
<div class="w-1.5 h-1.5 rotate-45 bg-primary/20"></div>
</div>
</div>
</div>
<!-- CTA Section -->
<div class="flex flex-col items-center gap-8">
<button class="group relative px-12 py-4 border border-primary/40 hover:bg-primary/10 transition-all duration-500 overflow-hidden">
<span class="relative z-10 font-label-md text-label-md text-primary tracking-[0.15em] uppercase">Continue to reflection</span>
<div class="absolute inset-0 bg-primary/5 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
</button>
<div class="flex items-center gap-4">
<span class="w-8 h-[1px] bg-primary/10"></span>
<span class="font-caption text-caption text-secondary-fixed-dim/30 italic">Step 4 of 6</span>
<span class="w-8 h-[1px] bg-primary/10"></span>
</div>
</div>
</div>
</main>
<!-- Decorative Elements (Glassmorphic Orbs) -->
<div class="fixed top-1/4 -left-32 w-96 h-96 bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-1/4 -right-32 w-80 h-80 bg-secondary/5 rounded-full blur-[100px] pointer-events-none"></div>
<script>
        // Micro-interaction for the textarea
        const textarea = document.querySelector('textarea');
        const progressLine = document.getElementById('progress');

        textarea.addEventListener('input', (e) => {
            const length = e.target.value.length;
            // Subtle shift in progress glow based on typing
            if (length > 0) {
                progressLine.style.boxShadow = `0 0 ${Math.min(length / 5, 20)}px rgba(242, 202, 80, 0.4)`;
            } else {
                progressLine.style.boxShadow = 'none';
            }
        });

        // Simple button click effect
        const cta = document.querySelector('button.group');
        cta.addEventListener('click', function() {
            this.style.transform = 'scale(0.98)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 150);
        });
    </script>
</body></html>
